# PR pipeline (16 §12): typecheck, lint, unit, contract, module matrix, build, licence and secret scan.
# `pnpm check` runs the same steps locally. Actions are pinned by commit SHA; Dependabot keeps them current.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint
      - name: SPDX headers
        run: pnpm check:headers
      - name: Unit tests
        run: pnpm test:unit
      - name: Web tests
        run: pnpm vitest run --project web
      - name: Contract tests (DB, storage, pubsub, auth)
        run: pnpm test:contract
      - name: Module boot matrix
        run: pnpm test:matrix
      - name: Build
        run: pnpm build
      - name: Dependency audit (S-14)
        run: pnpm audit --audit-level high
      - name: Licence scan
        run: pnpm check:licenses
      - name: Secret scan
        run: pnpm check:secrets

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs "${{ github.event.pull_request.base.sha }}"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          cache-from: type=gha
