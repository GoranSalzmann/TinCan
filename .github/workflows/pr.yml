# PR pipeline (16 §12): typecheck, lint, unit, contract, module matrix, build, licence and secret scan.
# `pnpm check` runs the same steps locally. Actions are pinned by commit SHA; Dependabot keeps them current.
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint
      - name: SPDX headers
        run: pnpm check:headers
      - name: Unit tests
        run: pnpm test:unit
      - name: Web tests
        run: pnpm vitest run --project web
      - name: Contract tests (DB, storage, pubsub, auth)
        run: pnpm test:contract
      - name: Module boot matrix
        run: pnpm test:matrix
      - name: Build
        run: pnpm build
      - name: Dependency audit (S-14)
        run: pnpm audit --audit-level high
      - name: Licence scan
        run: pnpm check:licenses
      - name: Secret scan
        run: pnpm check:secrets

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs "${{ github.event.pull_request.base.sha }}"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          cache-from: type=gha
