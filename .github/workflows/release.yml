# SPDX-License-Identifier: AGPL-3.0-or-later
# Release pipeline (docs/17 v1.0, docs/release-checklist.md). A pushed tag v1.2.3 or v1.2.3-beta.1:
#   1. checks the tag against package.json, finds the changelog section and runs the PR checks again,
#   2. builds tincan-server and tincan-web for linux/amd64 and linux/arm64 and pushes them to GHCR
#      (a beta tag never moves `latest`),
#   3. writes SBOMs (CycloneDX) for the lockfile and both images, SHA256SUMS and build provenance attestations,
#   4. creates a GitHub Release with the changelog section as its text and those files attached.
# Run by hand (Actions > Release > Run workflow) it is always a dry run: it builds, pushes nothing, creates nothing.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, e.g. 0.2.0-beta.1 (must equal package.json; the changelog section may still be Unreleased)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tags: ${{ steps.meta.outputs.tags }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      image_base: ${{ steps.mode.outputs.image_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "dry_run=$([ "$EVENT" = push ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          # Registry names must be lower case.
          echo "image_base=${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/tincan" >> "$GITHUB_OUTPUT"
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          if ! node scripts/release-meta.mjs "$REF" --notes release-notes.md; then
            [ "$EVENT" = push ] && exit 1
            echo "Dry run: carrying on without a filled changelog section."
            node scripts/release-meta.mjs "$REF"
            echo "(dry run: no release notes yet)" > release-notes.md
          fi
      # A release goes out only when the same checks as a pull request pass on this exact commit.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:headers
      - run: pnpm test:unit
      - run: pnpm vitest run --project web
      - run: pnpm test:contract
      - run: pnpm test:matrix
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm check:licenses
      - run: pnpm check:secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [server, web]
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: needs.prepare.outputs.dry_run == 'false'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}-${{ matrix.target }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          {
            echo "list<<TAGS_END"
            echo "$TAGS" | tr ',' '\n' | sed "s|^|${BASE}:|"
            echo "TAGS_END"
          } >> "$GITHUB_OUTPUT"
      - name: Build (pushes only on a tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.dry_run == 'false' }}
          tags: ${{ steps.tags.outputs.list }}
          # The provenance is the GitHub attestation below; BuildKit's own would add "unknown/unknown" entries to the index.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
      - name: Provenance attestation
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image_base }}-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image
        if: needs.prepare.outputs.dry_run == 'false'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.image_base }}-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: tincan-${{ matrix.target }}-${{ needs.prepare.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record the digest
        if: needs.prepare.outputs.dry_run == 'false'
        run: echo "${{ needs.prepare.outputs.image_base }}-${{ matrix.target }}@${{ steps.build.outputs.digest }}" > digest-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.prepare.outputs.dry_run == 'false'
        with:
          name: image-${{ matrix.target }}
          path: |
            tincan-${{ matrix.target }}-${{ needs.prepare.outputs.version }}.cdx.json
            digest-${{ matrix.target }}.txt

  release:
    needs: [prepare, images]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
          merge-multiple: true
      - name: SBOM of the dependencies (pnpm lockfile)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: parts/tincan-${{ needs.prepare.outputs.version }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Source archive, image list and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir release
          git archive --format=tar.gz --prefix="tincan-${VERSION}/" -o "release/tincan-${VERSION}-source.tar.gz" HEAD
          cp parts/*.cdx.json release/
          cat parts/digest-*.txt > release/IMAGES.txt
          cat release/IMAGES.txt
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then flag="--prerelease"; else flag="--latest"; fi
          gh release create "$TAG" release/* --verify-tag --title "Tin Can $TAG" --notes-file parts/release-notes.md "$flag"
