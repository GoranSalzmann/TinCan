# Media tests (16 §6, 17 M3, M4): the real server and web client with a real LiveKit and three headless Chromium clients on
# fake devices: voice, camera, screen share and the upload independence check (G4). Slower and heavier than the PR pipeline, so it runs nightly, on demand and when voice code changes.
name: Media tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "apps/server/src/modules/voice/**"
      - "apps/web/src/core/voice/**"
      - "apps/web/src/modules/voice/**"
      - "apps/web/src/modules/settings/CameraSection.tsx"
      - "tools/media-test/**"

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-person-call:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm --filter @tincan/web build
      - name: Three people in a call (voice, camera, screen share, G4)
        run: pnpm media-test
