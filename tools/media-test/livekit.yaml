# LiveKit for the media test: everything (LiveKit, the app, the web client and the browsers) shares one network
# namespace, so loopback is the address everybody uses and the webhook goes to the app on 127.0.0.1:3000.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  node_ip: 127.0.0.1
  enable_loopback_candidate: true
keys:
  mediakey: media-test-secret-0123456789abcdef
webhook:
  api_key: mediakey
  urls:
    - http://127.0.0.1:3000/api/v1/internal/livekit/webhook
